<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>방 배치 플래너</title>
  <meta name="description" content="방 크기를 입력하고 가구를 끌어다 놓아 배치를 계획하는 플래너" />
  <meta name="theme-color" content="#2f6fed" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="방 플래너" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" class="logo" aria-hidden="true"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <input id="planName" class="plan-name" value="내 방" aria-label="도면 이름" />
    </div>
    <div class="actions">
      <button class="icon-btn" data-act="undo" title="실행 취소 (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg><span>취소</span></button>
      <button class="icon-btn" data-act="redo" title="다시 실행 (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg><span>다시</span></button>
      <span class="sep"></span>
      <button class="icon-btn" data-act="exportPng" title="PNG 이미지로 저장"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 17-5-5-9 8"/></svg><span>이미지</span></button>
      <button class="icon-btn" data-act="exportJson" title="도면 파일(JSON) 저장"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg><span>저장</span></button>
      <button class="icon-btn" data-act="importJson" title="도면 파일 불러오기"><svg viewBox="0 0 24 24"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></svg><span>열기</span></button>
      <button class="icon-btn" data-act="newPlan" title="새 도면"><svg viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/><path d="M12 11v6M9 14h6"/></svg><span>새로</span></button>
      <input type="file" id="fileInput" accept="application/json,.json" hidden />
    </div>
  </header>

  <main class="layout">
    <aside id="sheet" class="sheet" data-state="collapsed">
      <button class="sheet-handle" id="sheetHandle" aria-label="패널 펼치기/접기"><span></span></button>
      <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="library" role="tab">가구</button>
        <button class="tab" data-tab="props" role="tab">속성</button>
        <button class="tab" data-tab="room" role="tab">방 설정</button>
      </nav>
      <div class="panels">
        <section class="panel active" id="panel-library">
          <input id="search" class="search" type="search" placeholder="가구 검색 (예: 침대, 소파)" />
          <p class="hint desktop-only">클릭하거나 도면으로 끌어다 놓으세요.</p>
          <p class="hint mobile-only">탭하면 화면 가운데에 추가됩니다.</p>
          <div id="library"></div>
        </section>
        <section class="panel" id="panel-props">
          <div id="propsEmpty" class="empty">가구를 선택하면 여기서 크기·색상·회전을 바꿀 수 있어요.</div>
          <form id="propsForm" class="form" hidden onsubmit="return false">
            <label class="full">이름<input name="name" type="text" /></label>
            <label>가로 (cm)<input name="w" type="number" min="5" max="2000" step="1" inputmode="numeric" /></label>
            <label>세로 (cm)<input name="h" type="number" min="5" max="2000" step="1" inputmode="numeric" /></label>
            <label>X 위치 (cm)<input name="x" type="number" step="1" inputmode="numeric" /></label>
            <label>Y 위치 (cm)<input name="y" type="number" step="1" inputmode="numeric" /></label>
            <label>회전 (°)<input name="rot" type="number" step="1" inputmode="numeric" /></label>
            <label>색상<input name="color" type="color" /></label>
            <div class="btn-row full">
              <button type="button" class="btn" data-act="rotate">90° 회전</button>
              <button type="button" class="btn" data-act="duplicate">복제</button>
              <button type="button" class="btn" data-act="toFront">맨 앞으로</button>
              <button type="button" class="btn" data-act="toBack">맨 뒤로</button>
              <button type="button" class="btn danger" data-act="delete">삭제</button>
            </div>
            <p id="propsWarn" class="warn" hidden></p>
          </form>
        </section>
        <section class="panel" id="panel-room">
          <form id="roomForm" class="form" onsubmit="return false">
            <label>방 가로 (cm)<input name="rw" type="number" min="100" max="3000" step="10" inputmode="numeric" /></label>
            <label>방 세로 (cm)<input name="rh" type="number" min="100" max="3000" step="10" inputmode="numeric" /></label>
            <label>격자 간격 (cm)
              <select name="grid"><option value="5">5</option><option value="10">10</option><option value="25">25</option><option value="50">50</option></select>
            </label>
            <label>벽 두께 (cm)<input name="wall" type="number" min="0" max="50" step="1" inputmode="numeric" /></label>
            <label class="check full"><input name="snap" type="checkbox" /> 격자에 맞추기 (스냅)</label>
            <label class="check full"><input name="dims" type="checkbox" /> 가구 치수 표시</label>
            <label class="check full"><input name="collide" type="checkbox" /> 겹침·벽 밖 경고 표시</label>
          </form>
          <div class="presets">
            <p class="label">빠른 방 크기</p>
            <div class="btn-row">
              <button class="btn" data-preset="300x300">원룸 3×3m</button>
              <button class="btn" data-preset="400x350">침실 4×3.5m</button>
              <button class="btn" data-preset="550x400">거실 5.5×4m</button>
              <button class="btn" data-preset="700x500">LDK 7×5m</button>
            </div>
          </div>
          <div id="stats" class="stats"></div>
          <div class="btn-row"><button class="btn danger" data-act="clearAll">가구 모두 지우기</button></div>
          <details class="help">
            <summary>사용법 / 단축키</summary>
            <ul>
              <li>가구 드래그: 이동 · 파란 원: 회전 · 오른쪽 아래 네모: 크기 조절</li>
              <li>빈 곳 드래그: 화면 이동 · 휠/두 손가락 핀치: 확대·축소</li>
              <li>Delete 삭제 · R 회전 · Ctrl+D 복제 · 방향키 1cm 이동 (Shift 10cm)</li>
              <li>Ctrl+Z / Ctrl+Y 실행 취소/다시 · 모든 변경은 자동 저장됩니다</li>
            </ul>
          </details>
        </section>
      </div>
    </aside>

    <div id="stage" class="stage">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="gridMinor" patternUnits="userSpaceOnUse" width="10" height="10"><path d="M10 0H0V10" fill="none" stroke="#e3e8f0" stroke-width="1" vector-effect="non-scaling-stroke"/></pattern>
          <pattern id="gridMajor" patternUnits="userSpaceOnUse" width="100" height="100"><rect width="100" height="100" fill="url(#gridMinor)"/><path d="M100 0H0V100" fill="none" stroke="#c9d3e3" stroke-width="1" vector-effect="non-scaling-stroke"/></pattern>
        </defs>
        <g id="world">
          <g id="roomLayer"></g>
          <g id="itemsLayer"></g>
          <g id="overlayLayer"></g>
        </g>
      </svg>
      <div id="selBar" class="sel-bar" hidden>
        <button data-act="rotate" title="90° 회전"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></button>
        <button data-act="duplicate" title="복제"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg></button>
        <button data-act="editProps" title="속성"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
        <button data-act="delete" class="danger" title="삭제"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
      </div>
      <div class="zoom-ctl">
        <button data-act="zoomIn" title="확대" aria-label="확대">+</button>
        <button data-act="zoomOut" title="축소" aria-label="축소">−</button>
        <button data-act="fit" title="화면에 맞추기" aria-label="화면에 맞추기"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
      </div>
      <div id="status" class="status"></div>
      <div id="toast" class="toast" hidden></div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
